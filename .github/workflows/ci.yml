name: CI

on:
  push:
  pull_request:

# `api` + `web` together are `make check` (ruff, mypy, pytest, eslint, tsc, next build); `e2e` is `make e2e`
# (scripts/e2e_local.sh: fake-Meta API + Next.js + scripts/smoke_test.py); `docker` repeats the smoke test in the image.
jobs:
  api:
    runs-on: ubuntu-latest
    env:
      FAKE_META: "1"  # tests run against the built-in fake Meta API: no keys, no cost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: ruff check api scripts tests docs/architecture.py
      - run: mypy api scripts
      - run: pytest -v tests
      - run: python scripts/check_keys.py --self-test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npx next build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python venv (the e2e script uses .venv/bin/python, like `make install`)
        run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - name: Build the website
        working-directory: web
        run: npm ci && npx next build
      - name: Full-stack e2e (same as `make e2e`)
        run: bash scripts/e2e_local.sh
      - if: failure()
        run: tail -100 /tmp/e2e-api.log /tmp/e2e-web.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (Render)
        run: docker build -f Dockerfile.api -t dalang-api .
      - name: Build all-in-one image
        run: docker build -t dalang-all .
      - name: Run all-in-one image on the fake Meta API
        run: |
          docker run -d --name dalang -p 3000:3000 -e FAKE_META=1 -e MAKE_VERTICAL=true dalang-all
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 2; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full-stack smoke test against the container
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install httpx
          python scripts/smoke_test.py http://127.0.0.1:3000
      - if: always()
        run: docker logs dalang | tail -100
